name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # GitHub Pages serves the committed files, so the committed version tags must be current (the build would renew them)
      - name: Version tags are current
        run: node tools/stamp.mjs --check
      - run: npm run build
      - name: Committed bundles and tags match a fresh build
        run: git diff --exit-code
      - run: npx playwright install --with-deps chromium
      - run: npm test
